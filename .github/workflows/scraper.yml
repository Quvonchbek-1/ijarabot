name: OLX Rental Bot

on:
  schedule:
    - cron: '*/30 * * * *'  # Har 30 daqiqada avtomatik ishga tushadi
  workflow_dispatch:         # Qo'lda (Manual) ishga tushirish tugmasi uchun

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'ni yuklab olish
        uses: actions/checkout@v4

      - name: Python'ni sozlash
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Seen IDs keshini yoqish (Takroriy e'lon chiqmasligi uchun)
        uses: actions/cache@v4
        with:
          path: seen_ids.txt
          key: seen-ids-${{ github.run_id }}
          restore-keys: |
            seen-ids-

      - name: Kerakli kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper

      - name: Botni ishga tushirish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
        run: |
          python main.py
